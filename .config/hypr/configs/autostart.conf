#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
$eww = ~/Documents/githubClones/eww/target/release/eww

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

## Used hyprshade earlier, saved it just for save
#exec-once = exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
#exec = hyprshade auto

exec-once = swww-daemon 
exec-once = swww img $wallpaperfir --transition-fps 144 --transition-duration 1 --transition-type fade --transition-bezier .07,.82,.17,1 &&  walrs -q -i $wallpaperfir -b 20 -s 120 -W
exec-once = walrs -q -i $wallpaperfir -W

exec-once = $eww daemon 
exec-once = $eww open topbar 
exec-once = $eww reload

exec-once = sh -c $startsound
exec-once = hyprctl dispatch exec "[float; size 1024 768; center]" -- kitty --class welcome-term bash -c "~/.config/hypr/scripts/statistic_message/welcome_window.sh"

exec-once = hyprlauncher -d
exec-once = hypridle &
exec-once = hyprsunset &


exec-once = ~/.config/hypr/scripts/low_battery_notify.sh

