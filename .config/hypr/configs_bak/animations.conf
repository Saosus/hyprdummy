animations {
    enabled = yes, please :)
                    
    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = easeInOutBack, 0.68, -0.6, 0.32, 1.6 #с более сильным "выбросом"
    bezier = easeOutBack, 0.34, 1.35, 0.64, 1 # С легким "перелетом" в конце (оживленно)
    bezier = easeInBack, 0.36, 0, 0.66, -0.56 
    bezier = easeOutQuad, 0.5, 1, 0.89, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1      # Очень плавное, почти "шелковое" завершение
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1  # Симметричная, с акцентом на середине
    bezier = smoothStop, 0.11, 0.99, 0.25, 1.01 # Резкий старт, очень плавный стоп
    bezier = overshot, 0.7, 0.01, 0.37, 1.06   # Перелетает цель и возвращается

# Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  linear
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     8.0,   easeInOutBack, slide top
    animation = windowsOut,    1,     7.0,   easeOutBack, popin 40%
    animation = windowsMove,   1,     8.0,   easeOutBack, gnomed
    animation = fadeIn,        1,     8.0,   easeOutQuint
    animation = fadeOut,       1,     5.1,   easeOutQuint
    animation = fadeSwitch,    1,     7.46,  easeOutQuint
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4.5,   easeOutBack, popin
    animation = layersOut,     1,     4.0,   easeInBack, popin 1%
    animation = fadeLayersIn,  1,     4.0,   almostLinear
    animation = fadeLayersOut, 1,     5.5,   almostLinear
    animation = workspaces,    1,     4.50,  almostLinear, fade
    animation = workspacesIn,  1,     8.50,  easeOutQuint, slide 
    animation = workspacesOut, 1,     8.50,  easeOutQuint, slide 
    animation = specialWorkspace, 1, 4.50, smoothStop, slidevert 100%
    animation = specialWorkspaceIn, 1, 4.50, almostLinear, slide top
    animation = specialWorkspaceOut, 1, 3.50, almostLinear, slide bottom 

    animation = zoomFactor,    1,     7,     quick
}
